name: STRINGS.CODEX.STORY_TRAITS.MUTANTER_FOUNDER.NAME
description: STRINGS.CODEX.STORY_TRAITS.MUTANTER_FOUNDER.DESCRIPTION
icon: gravitas_mutanter_founder_icon
colorHex: FFFFFF

additionalWorldTemplateRules:
  - names:
      - mod__storytraits/mutanter_founder
    listRule: GuaranteeOne
    priority: 201
    useRelaxedFiltering: true
    allowedCellsFilter:
      - command: All
      - command: ExceptWith
        tagcommand: AtTag
        tag: NoGlobalFeatureSpawning # this also excludes Space
      - command: ExceptWith  # too close to start
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 0
        maxDistance: 2
        ignoreIfMissingTag: true
      - command: ExceptWith  # too far from start
        tagcommand: DistanceFromTag
        tag: AtStart
        minDistance: 4
        maxDistance: 99
        ignoreIfMissingTag: true
      - command: ExceptWith # too close to surface
        tagcommand: DistanceFromTag
        tag: AtSurface
        minDistance: 0
        maxDistance: 2
      - command: ExceptWith
        temperatureRanges:
          - VeryHot
          - ExtremelyHot
      - command: ExceptWith
        zoneTypes: [OilField]